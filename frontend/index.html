<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Assess — FDM 热仿真分析</title>
<style>
:root {
  --bg: #14171c; --panel: #1c2129; --panel2: #232a35; --line: #2e3745;
  --text: #d7dee8; --dim: #8b96a5; --accent: #3fa7ff; --ok: #35c46f;
  --cold: #3d7bff; --hot: #ff5a4e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.logo { font-weight: 700; font-size: 15px; letter-spacing: .3px; margin-right: 6px; }
.logo b { color: var(--accent); }
.btn, select, input[type=number], input[type=text] {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; font: inherit; outline: none;
}
.btn { cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.field { display: flex; align-items: center; gap: 5px; color: var(--dim); }
.field input[type=number] { width: 72px; }
#progress { flex: 1; min-width: 160px; display: none; align-items: center; gap: 8px; }
#progress.on { display: flex; }
#pbar { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
#pbar>div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .2s; }
#ptext { color: var(--dim); min-width: 130px; font-variant-numeric: tabular-nums; }
#toast {
  position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 50;
  background: #3a1f22; color: #ffb4ad; border: 1px solid #7c3a34;
  padding: 8px 16px; border-radius: 8px; display: none; max-width: 70vw; white-space: pre-wrap;
}
main { flex: 1; display: flex; min-height: 0; }
#viewwrap { flex: 1; position: relative; min-width: 0; }
canvas#view { display: block; width: 100%; height: 100%; }
#hint {
  position: absolute; top: 10px; left: 12px; color: var(--dim); font-size: 12px;
  background: rgba(20,23,28,.6); padding: 4px 10px; border-radius: 6px; pointer-events: none;
}
aside {
  width: 330px; background: var(--panel); border-left: 1px solid var(--line);
  padding: 12px 14px; overflow-y: auto; display: none;
}
aside.on { display: block; }
aside h3 { margin: 14px 0 8px; font-size: 13px; color: var(--accent); }
aside h3:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; color: var(--dim); }
.kv b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
canvas.chart { width: 100%; height: 110px; background: var(--panel2); border-radius: 8px; }
.worstlayer { display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--dim); }
.worstlayer:hover { background: var(--panel2); color: var(--text); }
.worstlayer b { font-variant-numeric: tabular-nums; }
footer {
  display: flex; align-items: center; gap: 16px; padding: 7px 14px;
  background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap;
}
#layer { flex: 1; min-width: 220px; accent-color: var(--accent); }
#layernum { min-width: 130px; color: var(--dim); font-variant-numeric: tabular-nums; }
.legend { display: flex; align-items: center; gap: 0; height: 12px; border-radius: 6px; overflow: hidden; }
.legend i { width: 26px; height: 100%; display: block; }
.legendlab { color: var(--dim); font-size: 12px; }
.modegrp { display: flex; gap: 8px; align-items: center; color: var(--dim); }
.modegrp label { cursor: pointer; display: flex; gap: 4px; align-items: center; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/static/vendor/three.module.js",
    "three/addons/": "/static/vendor/addons/"
} }
</script>
</head>
<body>
<header>
  <span class="logo">Thermal<b>Assess</b></span>
  <label class="btn" for="file">打开 G-code</label>
  <input type="file" id="file" accept=".gcode,.gco,.txt,.3mf" style="display:none">
  <span class="field">材料 <select id="material"></select></span>
  <span class="field">腔温°C <input type="number" id="chamber" placeholder="自动" min="0" max="80" step="1"></span>
  <span class="field">体素 <select id="voxel">
    <option value="1">1.0</option><option value="1.5" selected>1.5</option>
    <option value="2">2.0</option><option value="3">3.0</option>
  </select></span>
  <button class="btn primary" id="simulate" disabled>开始热仿真</button>
  <select id="optmode" title="优化模式：热质量优先=TQI 窗口迭代；表面一致=平滑逐层层时（消除冷却纹理）">
    <option value="quality" selected>热质量优先</option>
    <option value="surface">表面一致（层时平滑）</option>
  </select>
  <button class="btn" id="optimize" disabled title="基于热仿真结果自动调整逐层速度">优化打印速度</button>
  <button class="btn" id="stop" hidden title="中断正在进行的仿真或优化">停止</button>
  <a class="btn ghost" href="/calibration" target="_blank">校准</a>
  <span class="field" title="切换 Bambu Studio 的 Helio 端点。切换后需完全关闭并重启 Bambu Studio 才生效">
    <span style="color:var(--dim)">BS Helio 端点</span>
    <select id="bsmode">
      <option value="local">本地引擎</option>
      <option value="helio">官方 Helio 云</option>
    </select>
  </span>
  <div id="progress"><div id="pbar"><div></div></div><span id="ptext"></span></div>
</header>

<main>
  <div id="viewwrap">
    <canvas id="view"></canvas>
    <div id="hint">左键旋转 · 右键平移 · 滚轮缩放</div>
  </div>
  <aside id="report"></aside>
</main>

<div id="toast"></div>

<footer>
  <div class="modegrp">
    色彩
    <label><input type="radio" name="mode" value="feature" checked>特性</label>
    <label><input type="radio" name="mode" value="tqi">TQI</label>
  </div>
  <div class="legend" id="legend"></div>
  <span class="legendlab" id="legendlab">特性图例</span>
  <input type="range" id="layer" min="0" max="0" value="0" disabled>
  <span id="layernum">层 —</span>
  <label class="modegrp"><input type="checkbox" id="onlycur"> 仅当前层</label>
</footer>

<script type="module" src="/static/src/app.js"></script>
</body>
</html>
